# Render Infrastructure-as-Code
# https://render.com/docs/blueprint-spec
#
# 加了這個檔後，在 Render Dashboard → Service → Settings →
# 「Connect Repository」連接 GitHub repo，以後每次 git push 自動觸發部署。
# 環境變數的實際值（key/secret）不在這裡硬編，由 Render Dashboard 的
# Environment 頁面管理；這裡只列出需要存在的 key，防止遺漏。

services:
  - type: web
    name: xue-adventure
    runtime: node
    plan: free
    region: oregon
    # 朗讀架構（2026-10-04 v2）：edge-tts 已拆獨立服務 xue-tts（見下方），
    # 主應用以 HTTP 呼叫 TTS_SERVICE_URL；不再在本實例裝 Python edge-tts。
    # 未設 TTS_SERVICE_URL 或服務不可用時，synthesize 回 null、
    # 前端退回瀏覽器內建語音——部署絕不因朗讀而壞。
    #
    # ⚠️ 2026-10-04：**不要**把 buildCommand 寫成 `pnpm@10.4.1 install …`。
    # `pnpm@<version>` 只在 `npx pnpm@<version>` 這種「參數」位置有效；當成指令名時
    # shell 會直接找不到（本機實測 `zsh: command not found: pnpm@10.4.1`），
    # 建置必定失敗、部署失敗、舊版繼續服務——而且從 Render 外面看只像「沒部署」。
    # 要鎖 pnpm 版本請走 Corepack（`corepack enable` ＋ package.json 的
    # `packageManager` 欄位），或明確寫成 `npx pnpm@10.4.1 install …`。
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # ─── Node 版本（2026-10-04 新增）───
      # vite@7 要求 node ^20.19.0 || >=22.12.0。不鎖的話 Render 預設版本一變，
      # 部署就會在 build 階段失敗——而且是「與程式碼無關」的無預警失敗。
      - key: NODE_VERSION
        value: "22"
      # ─── 必須設定（Dashboard 裡填實際值）───
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # TiDB Cloud 連線字串，在 Dashboard 設定
      # ─── 朗讀（Edge TTS 獨立服務）───
      # 值為 xue-tts 服務 URL（例如 https://xue-tts.onrender.com）；
      # 未設則朗讀退回瀏覽器語音
      - key: TTS_SERVICE_URL
        sync: false
      # ─── 認證 ───
      - key: JWT_SECRET
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      # ─── LLM 路由（按優先序）───
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      # ─── LINE Messaging API ───
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      # ─── AWS S3（頭像上傳 proxy）───
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false

  # ─── Edge TTS 獨立朗讀服務（Python）───
  # edge-tts 是 Python 庫，拆成獨立服務後主應用（Node）不再需要 Python 環境。
  # 主應用透過 TTS_SERVICE_URL 呼叫；本服務不可用時前端退回瀏覽器內建語音。
  - type: web
    name: xue-tts
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r tts-service/requirements.txt
    startCommand: python tts-service/app.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TTS_CACHE_DIR
        value: /tmp/tts-cache
