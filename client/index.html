    <!-- 首屏骨架屏（JS 載入完成前顯示，不用等 React） -->
    <link rel="stylesheet" href="/skeleton.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>

    <!-- 首屏骨架屏：React 掛載後自動隱藏 -->
    <div id="app-skeleton" aria-hidden="true">
      <div class="skeleton-ship">⛵️</div>
      <div class="skeleton-title">寶島探險家</div>
      <div class="skeleton-subtitle">正在啟航…</div>
      <div class="skeleton-progress">
        <div class="skeleton-progress-bar"></div>
      </div>
    </div>
    <script>
      (function () {
        function hideSkeleton() {
          var el = document.getElementById("app-skeleton");
          if (el) {
            el.classList.add("skeleton-hidden");
            setTimeout(function () { el.remove(); }, 450);
          }
        }
        var root = document.getElementById("root");
        if (root) {
          var observer = new MutationObserver(function () {
            if (root.children.length > 0) {
              hideSkeleton();
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true, subtree: true });
        }
        // 保險：4 秒後強制隱藏
        setTimeout(hideSkeleton, 4000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
