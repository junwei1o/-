    <!-- 首屏骨架屏（JS 載入完成前顯示，不用等 React） -->
    <link rel="stylesheet" href="/skeleton.css" />

    <!-- 字型改用全本地系統字體堆疊（見 index.css），不再外部載入 Google Fonts：
         離線可用、不發第三方請求、避免 render-blocking 與 FOUT。 -->

    <!-- 掛載前即套用儲存的外觀主題，避免首屏色調閃爍（tidal 潮境為預設，不設屬性） -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("xue-theme-v1");
          if (t === "festival" || t === "exlibris" || t === "sunny") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- 首屏骨架屏：React 掛載後自動隱藏 -->
    <div id="app-skeleton" aria-hidden="true">
      <div class="skeleton-ship">⛵️</div>
      <div class="skeleton-title">寶島探險家</div>
      <div class="skeleton-subtitle">正在啟航…</div>
      <div class="skeleton-progress">
        <div class="skeleton-progress-bar"></div>
      </div>
    </div>
    <script>
      (function () {
        function hideSkeleton() {
          var el = document.getElementById("app-skeleton");
          if (el) {
            el.classList.add("skeleton-hidden");
            setTimeout(function () { el.remove(); }, 450);
          }
        }
        var root = document.getElementById("root");
        if (root) {
          var observer = new MutationObserver(function () {
            if (root.children.length > 0) {
              hideSkeleton();
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true, subtree: true });
        }
        // 保險：4 秒後強制隱藏
        setTimeout(hideSkeleton, 4000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <!-- 網站分析（umami）改由 main.tsx 在實際配置 VITE_ANALYTICS_ENDPOINT 時動態注入，未配置不發請求、不產生 404。 -->
  </body>
