# 最小 CI：型別檢查 → 測試 → 品質閘門 → 建置
#
# 本專案在此之前**完全沒有 CI**（0 個 workflow）。這個 workflow 的目的不是
# 「什麼都跑」，而是把專案已經寫好、但只有人工記得跑的那些閘門，變成 push/PR
# 時自動執行——避免「本地忘了跑 → 壞的東西進 main → Render 部署失敗」。
#
# 六個品質閘門都能在本機直接跑（scripts/*.mjs 與 package.json 的 qc:*），
# 全部為既有工具，沒有新增任何依賴。
#
# ⚠️ 這裡**不**跑 deploy。部署由 Render 的 autoDeploy 負責（見 render.yaml）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型別 / 測試 / 閘門 / 建置
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本由 package.json 的 "packageManager": "pnpm@10.4.1" 決定
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # --frozen-lockfile 是硬要求：render.yaml 的建置指令同樣用它，
      # 所以「lockfile 與 package.json 不同步」必須在 CI 就被擋下，
      # 而不是等 Render 部署時才失敗。
      - name: Install（frozen lockfile）
        run: pnpm install --frozen-lockfile

      - name: Type check（tsc --noEmit）
        run: pnpm check

      - name: 單元測試（vitest run）
        run: pnpm test

      # 以下六個閘門都是既有腳本，全部在本機實測為 PASS
      - name: 品質閘門
        run: |
          echo '── CSS 結構（選擇器有沒有被改壞）──'
          pnpm qc:css

          echo '── 洋蔥學院課程目錄 ──'
          pnpm qc:onion

          echo '── 題庫完整性 ──'
          pnpm qc:bank

          echo '── 繁體中文（docs/*.md 與原始碼不得出現簡體）──'
          node scripts/check-traditional.mjs

          echo '── 色彩對比度（design token 層）──'
          node scripts/contrast-check.mjs

          echo '── 答案位置分布（防止正解又固定在同一格）──'
          node scripts/qc-answer-distribution.mjs

      # 在 CI 建置一次，讓「建置壞掉」在合併前就發現，而不是等 Render 部署失敗
      - name: Build
        run: pnpm build
